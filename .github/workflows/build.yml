name: Samsung GKI Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ksun          
          - mode: twrp
            
    steps:
    - name: Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: Import Kernel Source
      uses: actions/checkout@v4   
      
    - name: Install Required Package
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld \
        libelf-dev erofs-utils android-sdk-libsparse-utils build-essential automake autoconf libtool pkg-config fuse3 e2fsprogs pv liblz4-dev uuid-dev \
        libfuse3-dev fuse3 f2fs-tools fuse2fs attr zlib1g-dev rsync \
        device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full \
        pv uuid-dev libfuse3-dev f2fs-tools fuse2fs attr

    - name: Setting Scripts Permission
      run: |    
        chmod +x build.sh
        chmod -R +x prebuilts/             

    - name: Kernel Build
      run: |   
        ./build.sh ${{ matrix.mode }}

    - name: Upload KernelSU Artifacts
      if: matrix.mode == 'ksun' || matrix.mode == 'susfs'
      uses: actions/upload-artifact@v4
      with:
        name: "Fold5_Kernel_File_${{ matrix.mode }}"
        path: |
          ./Galaxy_Fold5_KernelSU_Next_A16.tar          
          ./vendor_dlkm.img
          ./prebuilts/zip/Fold5_Kernel_File_KSUN.zip
        if-no-files-found: ignore

    - name: Upload TWRP Kernel Artifacts
      if: matrix.mode == 'twrp'
      uses: actions/upload-artifact@v4
      with:
        name: "Fold5_Kernel_File_TWRP"
        path: |
          ./out/msm-kalama-kalama-gki/dist/Image          
          ./vendor_boot.img
          ./vendor_dlkm.img
          ./prebuilts/vendor_boot_unpack/build/unzip_boot/root.1
        if-no-files-found: ignore  