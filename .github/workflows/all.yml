name: All Build (Fold5) 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: 0. Free up workflow space
      run: |
        curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
        chmod +x util_free_space.sh
        ./util_free_space.sh

    - name: 1. import kernel source
      uses: actions/checkout@v4   
      
    - name: 2. install package
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld libelf-dev

    - name: 3. setting permission
      run: chmod +x build_all.sh

    - name: 4. kernel build
      run: |   
        ./build_all.sh
        
    - name: 5. Upload Artifacts Kernel File
      uses: actions/upload-artifact@v4
      with:
        name: "GoRhanHee_Fold5_KernelSU-Next_SuSFS"
        path: |
          gorhanhee/*.tar
          gorhanhee/vendor_dlkm.img